services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: commonshub-brussels-web:latest
    restart: unless-stopped
    expose:
      - "${PORT:-3000}"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: ${PORT:-3000}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      # The website only reads pre-generated data. It is populated by the
      # separate chb pipeline that owns this volume.
      - commonshub-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-3000}/status.json >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  commonshub-data:
    name: commonshub-data
